[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "content-planner-agent"
version = "0.1.0"
description = "A local LangGraph content planning agent with auditable tools"
requires-python = ">=3.11"
dependencies = ["langgraph>=1.0,<2", "openai>=2,<3", "pydantic>=2.10,<3", "python-dotenv>=1,<2"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
content-agent = "content_agent.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/content_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"

